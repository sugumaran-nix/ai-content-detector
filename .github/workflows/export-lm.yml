name: Export lm.json

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/reference_lm.py'
      - 'backend/export_lm_json.py'

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nltk

      - name: Download NLTK data
        run: |
          python -c "
          import nltk
          nltk.download('brown')
          nltk.download('punkt')
          nltk.download('punkt_tab')
          "

      - name: Build reference LM pkl
        run: python backend/reference_lm.py

      - name: Export lm.json
        run: python backend/export_lm_json.py

      - name: Commit lm.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lm.json
          git diff --staged --quiet || git commit -m "chore: regenerate lm.json [skip ci]"
          git push
