import json, sys
from pathlib import Path

# Must import BigramLM before pickle.load so the class is in scope
from reference_lm import BigramLM, MODEL_PATH  # noqa: F401
import pickle

OUT_PATH = Path(__file__).parent.parent / "lm.json"

def main():
    if not MODEL_PATH.exists():
        print(f"ERROR: {MODEL_PATH} not found. Run reference_lm.py first.")
        sys.exit(1)
    print(f"Loading {MODEL_PATH} ...")
    with open(MODEL_PATH, "rb") as f:
        lm = pickle.load(f)
    print(f"Vocab: {lm.vocab_size}  Unigrams: {len(lm.unigram_counts)}  Bigrams: {len(lm.bigram_counts)}")
    payload = {
        "u": dict(lm.unigram_counts),
        "b": {prev: dict(nexts) for prev, nexts in lm.bigram_counts.items()},
        "v": lm.vocab_size,
    }
    print(f"Writing {OUT_PATH} ...")
    with open(OUT_PATH, "w", encoding="utf-8") as f:
        json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
    print(f"Done. {OUT_PATH.stat().st_size / 1_048_576:.1f} MB")

if __name__ == "__main__":
    main()
