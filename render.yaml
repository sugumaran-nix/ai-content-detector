services:
  - type: web
    name: ai-content-detector
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      python -c "import nltk; [nltk.download(p, quiet=True) for p in ['brown','punkt','punkt_tab','stopwords','averaged_perceptron_tagger','averaged_perceptron_tagger_eng']]" &&
      python reference_lm.py &&
      python train.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NLTK_DATA
        value: /opt/render/project/src/nltk_data
