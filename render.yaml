services:
  - type: web
    name: ai-content-detector
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      python -c "import nltk; [nltk.download(p, quiet=True) for p in ['brown','punkt','punkt_tab','stopwords','averaged_perceptron_tagger','averaged_perceptron_tagger_eng']]" &&
      python -c "
from pathlib import Path
lm_path = Path('model/reference_lm.pkl')
clf_path = Path('model/classifier.pkl')
if not lm_path.exists():
    from reference_lm import build_reference_lm, save_reference_lm
    save_reference_lm(build_reference_lm())
if not clf_path.exists():
    import train
"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
